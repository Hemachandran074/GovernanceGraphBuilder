name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (validation suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/localdevpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p localdevpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: localdevpassword
      NEO4J_DATABASE: neo4j
      LLM_PROVIDER: heuristic
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Start API and run the validation suite
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/ready > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 2
          done
          uv run python scripts/validate.py
          STATUS=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $STATUS
