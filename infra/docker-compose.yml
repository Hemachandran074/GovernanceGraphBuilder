# Local development stack: Neo4j graph database + backend API.
# Usage (from the repo root):
#   docker compose -f infra/docker-compose.yml up --build
#
# Neo4j browser: http://localhost:7474  (user: neo4j / pass: localdevpassword)
# API:           http://localhost:8000  (docs at /docs)

services:
  neo4j:
    image: neo4j:5.26
    container_name: ggb-neo4j
    environment:
      NEO4J_AUTH: neo4j/localdevpassword
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p localdevpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      # Repo root context so the image can build the frontend too (Strategy 1).
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ggb-backend
    environment:
      ENVIRONMENT: development
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: localdevpassword
      NEO4J_DATABASE: neo4j
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neo4j_data:
